name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      # Spec limits on a sample of the held-out corpus (docs/accuracy.md).
      - name: Accuracy
        run: dotnet run --project tools/Rekey.Accuracy -c Release --no-build -- data/accuracy tests/fixtures/keymaps --sample 500 --check
